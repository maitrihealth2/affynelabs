<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — AffyneLabs</title>
  <meta name="description" content="Get in touch with AffyneLabs to build a safer tomorrow, together. Reach out for research collaborations, early access, and partnerships.">
  
  <!-- Google Fonts: Cormorant Garamond (Editorial Serif) & Manrope (Clean Sans-serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Shared Design Tokens & Dedicated Contact Page Stylesheet -->
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="about.css">
  <link rel="stylesheet" href="products.css?v=9">
  <link rel="stylesheet" href="contact.css?v=2">
</head>
<body class="contact-page">

  <!-- Fixed Scenic Terrace & Ocean Background (Responsive: assets/contact.png on desktop, assets/contactus(mobile).png on mobile) -->
  <div class="contact-backdrop" aria-hidden="true">
    <picture class="contact-bg-picture">
      <source media="(max-width: 768px), (max-aspect-ratio: 1/1)" srcset="assets/contactus(mobile).png">
      <img 
        src="assets/contact.png" 
        alt="Contemporary oceanfront terrace overlooking deep blue water under sunny skies" 
        class="contact-bg-img"
      >
    </picture>
  </div>

  <!-- Transparent Site Header (Consistent with Home, About, and Products) -->
  <header class="site-header" id="header" role="banner">
    <!-- Top-left Branding -->
    <a href="index.html" class="brand-wordmark" aria-label="AffyneLabs Home">affynelabs</a>

    <!-- Exactly 3 Navigation Links: Home, About, Products -->
    <nav class="main-nav" id="desktopNav" aria-label="Primary Navigation">
      <ul class="nav-list">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="products.html" class="nav-link">Products</a></li>
      </ul>
    </nav>

    <!-- Mobile Navigation Toggle -->
    <button class="mobile-nav-toggle" id="mobileMenuToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileOverlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </header>

  <!-- Mobile Drawer Overlay -->
  <div class="mobile-menu-overlay" id="mobileOverlay" role="dialog" aria-modal="true" aria-label="Mobile navigation">
    <div class="mobile-menu-card" id="mobileMenuCard">
      <div class="mobile-menu-header">
        <span class="mobile-menu-title">Navigation</span>
      </div>
      <ul class="mobile-nav-list">
        <li>
          <a href="index.html" class="mobile-nav-link">
            <span>Home</span>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4-4-4-4"/></svg>
          </a>
        </li>
        <li>
          <a href="about.html" class="mobile-nav-link">
            <span>About</span>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4-4-4-4"/></svg>
          </a>
        </li>
        <li>
          <a href="products.html" class="mobile-nav-link">
            <span>Products</span>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4-4-4-4"/></svg>
          </a>
        </li>
      </ul>
      <div class="mobile-menu-footer">
        <span class="mobile-brand-tag">AffyneLabs</span>
      </div>
    </div>
  </div>  <!-- Main Contact Content Stage (Positioned in the open sky area, preserving chairs & ocean) -->
  <main class="contact-main" id="mainContent">
    <div class="contact-hero-stage">
      
      <!-- Center Editorial Headline -->
      <h1 class="contact-hero-headline">
        <span class="contact-hero-top">Let’s start</span>
        <span class="contact-hero-bottom">a conversation.</span>
      </h1>

      <!-- Contact Us Direct Action (Launches email directly) -->
      <div class="contact-action-wrapper">
        <a href="mailto:contact@affynelabs.com" class="contact-direct-link" id="contactEmailBtn" aria-label="Contact us directly via email">
          <span class="contact-direct-label">Contact us</span>
          <svg class="contact-direct-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 8h11M9 3.5l4.5 4.5-4.5 4.5"/>
          </svg>
        </a>
      </div>

      <!-- Social Media Icons Row -->
      <div class="contact-social-row" aria-label="Social media profiles">
        <!-- Instagram -->
        <a href="https://www.instagram.com/affynelabs/" target="_blank" rel="noopener noreferrer" class="contact-social-link" aria-label="AffyneLabs on Instagram">
          <svg class="social-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/affynelabs/" target="_blank" rel="noopener noreferrer" class="contact-social-link" aria-label="AffyneLabs on LinkedIn">
          <svg class="social-svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>

        <!-- X (Twitter) -->
        <a href="https://x.com/Affynelabs" target="_blank" rel="noopener noreferrer" class="contact-social-link" aria-label="AffyneLabs on X">
          <svg class="social-svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </a>
      </div>

    </div>
  </main>

  <!-- JavaScript -->
  <script src="main.js"></script>
  <script src="about.js"></script>
  <script src="products.js?v=9"></script>
  <script src="contact.js?v=2"></script>
  <script src="preload.js" defer></script>
  <script src="smooth-nav.js" defer></script>
</body>
</html>
